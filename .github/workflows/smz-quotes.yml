name: SMZ live prices

# One run stays alive through the US trading day and publishes quotes.json to the `live` branch every minute.
# The schedule only makes sure a run is alive: a run that finds fresh prices already being published exits at once,
# and a run that starts before the open waits for it. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '7,22,37,52 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish prices every minute
        env:
          GH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scanner/quotes.js --loop --dir "$RUNNER_TEMP/live" ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
